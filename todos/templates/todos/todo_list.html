<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease infinite;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .add-form {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .add-form input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .add-form input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #48dbfb;
            box-shadow: 0 0 20px rgba(72, 219, 251, 0.3);
        }

        .add-form input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .add-form button {
            padding: 16px 28px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: #1a1a2e;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-form button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            animation: slide-in 0.4s ease;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
            border-color: rgba(72, 219, 251, 0.3);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-title {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.5);
        }

        .todo-title {
            flex: 1;
            color: #fff;
            font-size: 1.1rem;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-toggle {
            background: linear-gradient(135deg, #48dbfb, #0abde3);
            color: #1a1a2e;
        }

        .btn-toggle:hover {
            box-shadow: 0 0 20px rgba(72, 219, 251, 0.5);
            transform: scale(1.05);
        }

        .todo-item.completed .btn-toggle {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: #fff;
        }

        .btn-delete:hover {
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
        }

        .empty-state::before {
            content: "✨";
            display: block;
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .stats {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.6);
        }

        .stats span {
            color: #48dbfb;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>

        <form class="add-form" action="{% url 'add_todo' %}" method="post">
            {% csrf_token %}
            <input type="text" name="title" placeholder="What needs to be done?" autocomplete="off" autofocus>
            <button type="submit">+</button>
        </form>

        {% if todos %}
        <ul class="todo-list">
            {% for todo in todos %}
            <li class="todo-item {% if todo.completed %}completed{% endif %}">
                <span class="todo-title">{{ todo.title }}</span>
                <form action="{% url 'toggle_todo' todo.pk %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-toggle">
                        {% if todo.completed %}Undo{% else %}Done{% endif %}
                    </button>
                </form>
                <form action="{% url 'delete_todo' todo.pk %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </li>
            {% endfor %}
        </ul>

        <div class="stats">
            {{ todos|length }} task{{ todos|length|pluralize }}
        </div>
        {% else %}
        <div class="empty-state">
            No todos yet. Add one above!
        </div>
        {% endif %}
    </div>
</body>
</html>
